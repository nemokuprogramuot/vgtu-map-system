name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main
      - 'req/*'
  pull_request:
    branches:
      - dev
      - main
      - 'req/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.11.0'  # Adjust the Node.js version as needed

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    - name: Run Tests
      run: npm test
